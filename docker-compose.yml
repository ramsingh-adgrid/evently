services:

  postgres:
    image: postgres:16
    container_name: evently-postgres
    environment:
      POSTGRES_USER: evently
      POSTGRES_PASSWORD: evently
      POSTGRES_DB: evently_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evently"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: evently-mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: evently-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7
    container_name: evently-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evt-core-service:
    build:
      context: .
      dockerfile: evt-core-service/Dockerfile
    container_name: evently-core
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/evently_db
      SPRING_DATASOURCE_USERNAME: evently
      SPRING_DATASOURCE_PASSWORD: evently
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  evt-open-service:
    build:
      context: .
      dockerfile: evt-open-service/Dockerfile
    container_name: evently-open
    environment:
      EVT_CORE_SERVICE_HOST: evt-core-service
      EVT_CORE_SERVICE_GRPC_PORT: 9090
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    depends_on:
      evt-core-service:
        condition: service_started
      kafka:
        condition: service_healthy

  evt-notification-service:
    build:
      context: .
      dockerfile: evt-notification-service/Dockerfile
    container_name: evently-notification
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/evently_notifications
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  evt-bff:
    build: ./evt-bff
    container_name: evently-bff
    environment:
      EVT_OPEN_SERVICE_URL: http://evt-open-service:8082
    ports:
      - "8080:8080"
    depends_on:
      - evt-open-service